<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 210" width="800" height="210">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f6feb" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00d6d2"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d6d2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d6d2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00d6d2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="798" height="208" rx="8"/></clipPath>
    <g id="peng">
      <ellipse cx="-11.5" cy="-19" rx="3" ry="8.5" fill="#21262d" stroke="#6e7681" stroke-width="0.8" transform="rotate(16 -11.5 -19)"/>
      <ellipse cx="11.5" cy="-19" rx="3" ry="8.5" fill="#21262d" stroke="#6e7681" stroke-width="0.8" transform="rotate(-16 11.5 -19)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="17" fill="#21262d" stroke="#6e7681" stroke-width="0.8"/>
      <ellipse cx="0" cy="-16" rx="7.5" ry="12" fill="#c9d1d9"/>
      <circle cx="0" cy="-33" r="9" fill="#21262d" stroke="#6e7681" stroke-width="0.8"/>
      <rect x="-6" y="-35.5" width="12" height="3" rx="1.5" fill="#00d6d2" opacity="0.9"/>
      <path d="M-2.2 -30.5 L2.2 -30.5 L0 -27.5 Z" fill="#d29922"/>
      <ellipse cx="-4.5" cy="-1" rx="4" ry="1.8" fill="#d29922"/>
      <ellipse cx="4.5" cy="-1" rx="4" ry="1.8" fill="#d29922"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="209" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#frame)">
    <rect width="800" height="210" fill="url(#grid)"/>
    <!-- сканирующая полоса -->
    <rect x="0" y="-60" width="800" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;210" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD-уголки -->
  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <path d="M14 32V14H32"/><path d="M768 14H786V32"/>
    <path d="M14 178V196H32"/><path d="M786 178V196H768"/>
  </g>

  <!-- Статус -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">
    <circle cx="40" cy="40" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="44" fill="#3fb950">ONLINE</text>
    <text x="760" y="44" text-anchor="end" fill="#6e7681">GITHUB / PROFILE</text>
  </g>

  <!-- Ник с глитч-эффектом -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" letter-spacing="6" text-anchor="middle">
    <text x="400" y="100" fill="#00d6d2" opacity="0.7">FISHKADORI909
      <animate attributeName="x" values="400;400;403;397;400;400" keyTimes="0;0.86;0.88;0.9;0.92;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="100" fill="#f778ba" opacity="0.7">FISHKADORI909
      <animate attributeName="x" values="400;400;397;403;400;400" keyTimes="0;0.86;0.88;0.9;0.92;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="100" fill="#e6edf3">FISHKADORI909</text>
  </g>
  <rect x="270" y="118" width="260" height="2" fill="url(#accent)"/>
  <text x="400" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="4" fill="#8b949e">PYTHON · DATA · WEB</text>

  <!-- Лёд и пингвины -->
  <rect x="40" y="186" width="720" height="1" fill="#30363d"/>
  <g transform="translate(120 186) scale(0.8)">
    <g><animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="1.1s" repeatCount="indefinite"/><use xlink:href="#peng" href="#peng"/></g>
  </g>
  <g transform="translate(145 186) scale(0.5)">
    <g><animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="0.8s" repeatCount="indefinite"/><use xlink:href="#peng" href="#peng"/></g>
  </g>
  <g transform="translate(680 186) scale(0.8)">
    <g><animateTransform attributeName="transform" type="rotate" values="5;-5;5" dur="1.2s" repeatCount="indefinite"/><use xlink:href="#peng" href="#peng"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 186;840 186" dur="20s" repeatCount="indefinite"/>
    <g transform="scale(0.68)">
      <g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="0.5s" repeatCount="indefinite"/><use xlink:href="#peng" href="#peng"/></g>
    </g>
    <g transform="translate(-22 0) scale(0.42)">
      <g><animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="0.4s" repeatCount="indefinite"/><use xlink:href="#peng" href="#peng"/></g>
    </g>
  </g>
</svg>
